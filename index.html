<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/app.js" defer></script>
  <link rel="stylesheet" href="css/styles.css">
  <title>Connect 4 game</title>
</head>
<body class="bg-[#7A45FF] flex flex-col items-center min-h-screen relative">
  <header class="w-full p-10">
    <div class="flex justify-center">
        <button id="restart-game" class="bg-[#5D2CD7] text-white font-semibold px-5 py-1 rounded-xl">Restart</button>
    </div>
  </header>
  <!-- Modal iniciar juego -->
  <div class="winner-modal start-modal hidden" id="start-modal" role="dialog" aria-modal="true" aria-labelledby="start-title">
    <div class="winner-card start-card">
      <div class="start-mascots" aria-hidden="true">
        <div class="winner-mascot start-mascot-red">
          <span class="winner-eye winner-eye-left"></span>
          <span class="winner-eye winner-eye-right"></span>
          <span class="winner-smile"></span>
        </div>
        <div class="winner-mascot start-mascot-yellow">
          <span class="winner-eye winner-eye-left"></span>
          <span class="winner-eye winner-eye-right"></span>
          <span class="winner-smile"></span>
        </div>
      </div>
      <p class="winner-label">¡Cuatro en línea!</p>
      <p id="start-title" class="winner-name">¿Preparados?</p>
      <p class="winner-caption">El juego comienza en</p>
      <p id="start-time" class="start-countdown">3</p>
    </div>
  </div>
  <div id="winner-modal" class="winner-modal hidden" role="dialog" aria-modal="true" aria-labelledby="winner-name">
    <div class="winner-card">
      <div class="winner-mascot" aria-hidden="true">
        <span class="winner-eye winner-eye-left"></span>
        <span class="winner-eye winner-eye-right"></span>
        <span class="winner-smile"></span>
      </div>
      <p class="winner-label">¡Cuatro en línea!</p>
      <p id="winner-name" class="winner-name"></p>
      <p class="winner-caption">Una jugada para celebrar.</p>
      <span class="winner-point">+1 punto</span>
      <button id="close-winner" class="winner-button">Ver el tablero</button>
      <button id="next-round" class="winner-button winner-next-round">Otra ronda</button>
    </div>
  </div>
  <main class="grid grid-cols-[20%_60%_20%] w-full flex-1 items-center p-10">
    <!-- Contenedor -->
    <div class="flex items-center justify-end">
      <div class="text-center bg-white border-3 border-black rounded-3xl p-5 pt-10 shadow-[0_10px_0_0_#000] relative">
        <!-- Cara -->
         <div class="w-14 h-14 bg-[#FF6388] rounded-full border-3 shadow-[0_5px_0_0_#000] absolute -top-10 right-1/3">
          <!-- Ojos -->
          <div class="absolute top-4 right-2 w-1 h-2 rounded-full bg-black"></div>
          <div class="absolute top-4 left-6 w-1 h-2 rounded-full bg-black"></div>
          <!-- Boca -->
          <div class="absolute bottom-2 left-5 w-6 h-3 overflow-hidden">
            <div class="absolute bottom-0 w-6 h-6 rounded-full border-[3px] border-black"></div>
          </div>
         </div>
        <h3 class="text-3xl uppercase">Player 1</h3>
        <p id="score-1" class="text-6xl font-bold">0</p>
      </div>
    </div>
    <!-- Tablero -->
     <div class="w-full flex flex-col items-center justify-center">
       <div class="w-[600px] h-[560px] overflow-hidden rounded-3xl border-[3px] border-black bg-white p-5">
         <div class="flex flex-col" id="board">
         </div>
       </div>
       <div id="turn-card" class="turn-card" role="status" aria-live="polite">
         <svg class="turn-card-shape" viewBox="0 0 220 120" aria-hidden="true">
           <path d="M 14 33 L 102 5 Q 110 2 118 5 L 206 33 Q 216 36 216 47 V 100 Q 216 114 202 114 H 18 Q 4 114 4 100 V 47 Q 4 36 14 33 Z" />
         </svg>
         <span>Turno de</span>
         <strong id="turn-player">Rojo</strong>
       </div>
     </div>
    <!-- Contenedor -->
    <div class="flex items-center justify-start">
      <div class="text-center bg-white border-3 border-black rounded-3xl p-5 pt-10 shadow-[0_10px_0_0_#000] relative">
        <!-- Cara -->
         <div class="w-14 h-14 bg-[#FFD166] rounded-full border-3 shadow-[0_5px_0_0_#000] absolute -top-10 right-1/3">
          <!-- Ojos -->
          <div class="absolute top-4 left-2 w-1 h-2 rounded-full bg-black"></div>
          <div class="absolute top-4 right-6 w-1 h-2 rounded-full bg-black"></div>
          <!-- Boca -->
          <div class="absolute bottom-2 right-5 w-6 h-3 overflow-hidden">
            <div class="absolute bottom-0 w-6 h-6 rounded-full border-[3px] border-black"></div>
          </div>
         </div>
        <h3 class="text-3xl uppercase">Player 2</h3>
        <p id="score-2" class="text-6xl font-bold">0</p>
      </div>
    </div>
  </main>
</body>
</html>
