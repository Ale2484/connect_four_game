<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/app.js" defer></script>
  <title>Connect 4 game</title>
</head>
<body class="bg-[#7A45FF] p-10 flex flex-col items-center min-h-screen">
  <header class="w-full">
    <div class="grid grid-cols-3">
      <div class="flex justify-center">
        <button class="bg-[#5D2CD7] text-white font-semibold px-5 py-1 rounded-xl">Menu</button>
      </div>
      <button>&nbsp;</button>
      <div class="flex justify-center">
        <button class="bg-[#5D2CD7] text-white font-semibold px-5 py-1 rounded-xl">Restart</button>
      </div>
    </div>
  </header>
  <main class="grid grid-cols-[15%_70%_15%] w-full flex-1 items-center">
    <!-- Contenedor -->
    <div class="flex items-center justify-center">
      <div class="text-center bg-white border-3 border-black rounded-3xl p-5 pt-10 shadow-[0_10px_0_0_#000] relative">
        <!-- Cara -->
         <div class="w-14 h-14 bg-[#FF6388] rounded-full border-3 shadow-[0_5px_0_0_#000] absolute -top-10 right-1/3">
          <!-- Ojos -->
          <div class="absolute top-4 right-2 w-1 h-2 rounded-full bg-black"></div>
          <div class="absolute top-4 left-6 w-1 h-2 rounded-full bg-black"></div>
          <!-- Boca -->
          <div class="absolute bottom-2 left-5 w-6 h-3 overflow-hidden">
            <div class="absolute bottom-0 w-6 h-6 rounded-full border-[3px] border-black"></div>
          </div>
         </div>
        <h3 class="text-3xl uppercase">Player 1</h3>
        <p class="text-6xl font-bold">0</p>
      </div>
    </div>
    <!-- Tablero -->
     <div class="w-full flex items-center justify-center">
       <div class="w-[600px] h-[560px] overflow-hidden rounded-3xl border-[3px] border-black bg-white p-5">
         <div class="flex flex-col" id="board">
           <!-- Circulos -->
            <!--
            <div class="flex items-center justify-between my-3" id="fila1">
             <div class="w-16 h-16 rounded-full bg-[#7A45FF] border-3 shadow-[0_-5px_0_2px_#000]"></div>
             <div class="w-16 h-16 rounded-full bg-[#7A45FF] border-3 shadow-[0_-5px_0_2px_#000]"></div>
             <div class="w-16 h-16 rounded-full bg-[#7A45FF] border-3 shadow-[0_-5px_0_2px_#000]"></div>
             <div class="w-16 h-16 rounded-full bg-[#7A45FF] border-3 shadow-[0_-5px_0_2px_#000]"></div>
             <div class="w-16 h-16 rounded-full bg-[#7A45FF] border-3 shadow-[0_-5px_0_2px_#000]"></div>
             <div class="w-16 h-16 rounded-full bg-[#7A45FF] border-3 shadow-[0_-5px_0_2px_#000]"></div>
            </div>
            -->
         </div>
       </div>
     </div>
  </main>
</body>
</html>
